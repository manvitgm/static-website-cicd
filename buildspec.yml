version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 18
    commands:
      - echo "Installing dependencies..."

  pre_build:
    commands:
      - echo "Pre-build phase - running validations..."
      - echo "Validating HTML files exist..."
      - ls -la

  build:
    commands:
      - echo "Build phase started on $(date)"
      - echo "Building static website..."
      - mkdir -p build
      - cp index.html build/
      - cp styles.css build/
      - echo "Build completed successfully!"

  post_build:
    commands:
      - echo "Post-build phase..."
      - echo "Syncing files to S3 bucket..."
      - aws s3 sync build/ s3://new---cicd --delete
      - echo "Deployment completed successfully!"

artifacts:
  files:
    - '**/*'
  base-directory: build

cache:
  paths: []
